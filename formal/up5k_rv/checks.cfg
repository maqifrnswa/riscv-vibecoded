# up5k-rv -- M1 formal binding config (consumed by riscv-formal genchecks.py).
#
# Generates the sby check set that proves rv32i_core against the riscv-formal
# RV32I model suite. Consumed by scripts/formal_m1.sh, which runs genchecks.py
# from a build-time copy of this file inside the riscv-formal submodule
# (formal/riscv-formal/cores/up5k_rv/), then post-processes the generated
# .sby files (read_slang partition, RESET_CYCLES 1->8 -- see that script).
#
# M1 scoping (docs/roadmap.md M1 handoff notes + .slim/deepwork/m1-core-rvfi.md):
#   - isa rv32i: exactly the 36 base RV32I encodings generate instruction
#     checks. Each check constrains the retired instruction to its encoding via
#     `assume(spec_valid)` on the channel, so ecall/ebreak/csr/fence and any
#     unsupported encoding can never be the checked retirement (traps are M2;
#     unsupported encodings retire as NOPs in decoder.sv).
#   - mode prove: k-induction via smtbmc yices (P1a engine validation; z3 and
#     abc pdr were rejected there).
#   - [assume]: retired load/store effective addresses are aligned to their
#     access width. The M1 core has no traps, so the spec models' spec_trap=1
#     for unaligned accesses would otherwise produce counterexamples; the
#     alignment assumption scopes the proof to spec-legal aligned accesses
#     (D9 misaligned->trap lands in M2 and the assumption is dropped there).

[options]
isa rv32i
mode prove
solver yices

[depth]
insn            48
reg       8     17
pc_fwd    8     48
pc_bwd    8     21
cover     1     15

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_UMODE
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);

# Alignment scoping assumption (applies to every generated check). The
# effective address is rs1_rdata + imm; the insn models compute spec_trap from
# exactly this value, so constraining it to the access width keeps spec_trap=0.
# NRET=1, so the flat rvfi_* wire names index directly.
[assume]
wire [31:0] rvfi_load_addr  = rvfi_rs1_rdata + $signed(rvfi_insn[31:20]);
wire [31:0] rvfi_store_addr = rvfi_rs1_rdata + $signed({rvfi_insn[31:25], rvfi_insn[11:7]});
wire [31:0] rvfi_jalr_addr  = rvfi_rs1_rdata + $signed(rvfi_insn[31:20]);  // jalr target pre-mask
wire [31:0] rvfi_brk_target = rvfi_pc_rdata + $signed({rvfi_insn[31], rvfi_insn[7], rvfi_insn[30:25], rvfi_insn[11:8], 1'b0});
wire [31:0] rvfi_jal_target = rvfi_pc_rdata + $signed({rvfi_insn[31], rvfi_insn[19:12], rvfi_insn[20], rvfi_insn[30:21], 1'b0});
always @* begin
  if (!reset && rvfi_valid[0]) begin
    // M1 scoping: the retired instruction's PC is 4-aligned. The spec models
    // require a trap for misaligned instruction fetch (spec_trap=1), which the
    // trap-less M1 core cannot provide; only unaligned-PC induction pre-states
    // violate this -- all reachable PCs are aligned (reset vector + pc+4 +
    // 4-aligned control-flow targets).
    assume (rvfi_pc_rdata[1:0] == 2'b0);
    if (rvfi_insn[6:0] == 7'b0000011) begin  // loads
      if (rvfi_insn[14:12] == 3'b001 || rvfi_insn[14:12] == 3'b101)  // lh/lhu
        assume (rvfi_load_addr[0] == 1'b0);
      if (rvfi_insn[14:12] == 3'b010)  // lw
        assume (rvfi_load_addr[1:0] == 2'b0);
    end
    if (rvfi_insn[6:0] == 7'b0100011) begin  // stores
      if (rvfi_insn[14:12] == 3'b001)  // sh
        assume (rvfi_store_addr[0] == 1'b0);
      if (rvfi_insn[14:12] == 3'b010)  // sw
        assume (rvfi_store_addr[1:0] == 2'b0);
    end
    if (rvfi_insn[6:0] == 7'b1100011) begin  // branches: 4-aligned target
      assume (rvfi_brk_target[1:0] == 2'b0);
    end
    if (rvfi_insn[6:0] == 7'b1101111) begin  // jal: 4-aligned target
      assume (rvfi_jal_target[1:0] == 2'b0);
    end
    if (rvfi_insn[6:0] == 7'b1100111 && rvfi_insn[14:12] == 3'b000) begin  // jalr
      // target = (rs1 + imm) & ~1; RV32I still requires 4-alignment, and the
      // spec models compute spec_trap from the pre-mask sum.
      assume (rvfi_jalr_addr[1:0] == 2'b0);
    end
  end
end
