# up5k-rv -- M2 formal binding config (consumed by riscv-formal genchecks.py).
#
# Generates the sby check set that proves rv32i_core against the riscv-formal
# RV32IMC model suite (I + C + M + traps + CSRs). Consumed by
# scripts/formal_m2.sh, which runs genchecks.py from a build-time copy of this
# file inside the riscv-formal submodule (formal/riscv-formal/cores/up5k_rv/),
# then post-processes the generated .sby files (read_slang partition,
# RESET_CYCLES 1->8 -- see scripts/formal_m2_gen.py).
#
# M2 scoping (docs/roadmap.md M2 + .slim/deepwork/m2-c-trap-csr.md):
#   - isa rv32imc: 70 instruction checks (37 I + 25 C + 8 M). The M instructions
#     are the ALTOPS fake ops (D18); the models assert rd_wdata byte-exact.
#   - [csrs] mcycle inc upcnt: pins the mcycle/mcycleh counter model
#     (incl. the mcycleh half-consistency rule via CSRWH).
#   - The M1 [assume] alignment block is DELETED: the M2 core traps on the
#     model-pinned unaligned cases, so they become spec_trap=1 checks
#     (design.md §3.3 model-matched trap conditions).
#   - RISCV_FORMAL_UMODE is dropped: the core reports rvfi_mode=3 (M-mode),
#     which the [csrs] csrw checks require for M-CSR access (Gate-1 4.1).
#   - liveness: prove every retirement is eventually followed by the next
#     (no deadlock); the hazard-free schedule + combinational slave satisfy it.

[options]
isa rv32imc
mode prove
solver yices

[depth]
insn            48
reg       8     17
pc_fwd    8     48
pc_bwd    8     21
cover     1     15
liveness  1     10    30
csrw            48
csrc_inc   1    48
csrc_upcnt 1    48

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[csrs]
mcycle inc upcnt

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
